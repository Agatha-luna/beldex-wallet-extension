<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Michroma";
        src: url("fonts/michroma-400.woff2") format("woff2");
        font-weight: 400; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: "Space Mono";
        src: url("fonts/space-mono-400.woff2") format("woff2");
        font-weight: 400; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: "Space Mono";
        src: url("fonts/space-mono-700.woff2") format("woff2");
        font-weight: 700; font-style: normal; font-display: swap;
      }

      :root {
        --bg: #0a0a0a;
        --panel: #101010;
        --border: #222222;
        --green: #3ec745;       /* brand green from the BDX logo */
        --blue: #1574ad;        /* brand blue from the BDX logo */
        --text: #f2f2f2;
        --text-dim: #8a8a8a;
        --red: #ff5c5c;
        --display: "Michroma", system-ui, sans-serif;
        --mono: "Space Mono", "SF Mono", Consolas, monospace;
      }
      * { box-sizing: border-box; }
      body {
        width: 100%;
        min-width: 300px;
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        font-family: var(--mono);
        font-size: 12.5px;
        background-color: var(--bg);
        /* the dot-grid from beldex.io */
        background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1.5px);
        background-size: 26px 26px;
      }
      html, body, #root { height: 100%; }
      .wrap {
        padding: 18px; max-width: 440px; margin: 0 auto;
        display: flex; flex-direction: column;
        height: 100vh; overflow-y: auto; overflow-x: hidden;
      }
      body.tab-mode .wrap { max-width: 560px; }
      /* history gets exactly the vertical space left on screen; its own content scrolls */
      .card.history-card {
        flex: 1 1 0px; min-height: 100px;
        overflow-y: auto; padding: 4px 0;
        margin-bottom: 0;
      }
      /* home-screen token list: caps at ~4 rows, scrolls internally past that,
         so a wallet holding many tokens doesn't push History off-screen */
      .card.token-list {
        max-height: 240px;
        overflow-y: auto;
        padding: 0;
      }

      .token-row {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 0; cursor: pointer;
      }
      .token-row:hover { background: rgba(62, 199, 69, 0.06); }
      .token-avatar {
        width: 30px; height: 30px; border-radius: 50%; flex: none; overflow: hidden;
        display: flex; align-items: center; justify-content: center;
        font-family: var(--display); font-size: 12px; color: #fff; font-weight: 400;
      }
      .token-info { flex: 1; min-width: 0; }
      .token-title { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .token-title b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
      .token-subtitle {
        font-size: 10px; color: var(--text-dim);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .token-badge {
        font-size: 8.5px; color: var(--text-dim); border: 1px solid var(--border);
        padding: 1px 5px; white-space: nowrap; flex: none;
      }
      .token-values { text-align: right; flex: none; }
      .token-amount { font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums; }
      .token-unit { font-size: 10px; color: var(--text-dim); }

      .header {
        display: flex; align-items: center; justify-content: space-between;
        flex-wrap: wrap; gap: 8px; min-width: 0;
        margin-bottom: 16px; padding-bottom: 14px;
        border-bottom: 1px solid var(--border);
      }
      .brand {
        display: flex; align-items: center; gap: 5px;
        font-family: var(--display); font-size: 11px; letter-spacing: 0.5px;
        text-transform: uppercase;
        flex: 0 1 auto; min-width: 0;
      }
      /* Header left cluster: active-wallet switcher + chain label. Uses the
         display font (Michroma) so the in-app title matches the app's own
         branding; not uppercased — the wallet name shows as the user typed it. */
      .header-wallet {
        display: flex; align-items: center; gap: 8px;
        flex: 1 1 auto; min-width: 0;
      }
      .header-wallet .btn-wallet-switch {
        font-family: var(--display); font-size: 13px; font-weight: 400;
        flex: 0 1 auto; min-width: 0; max-width: 240px;
      }
      .header-actions {
        display: flex; align-items: center; gap: 4px;
        flex: 0 1 auto; min-width: 0;
      }
      .header-actions .btn-icon { padding: 3px 7px; font-size: 11px; }
      .btn-wallet-switch {
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        max-width: 80px;
      }
      .brand img { width: clamp(18px, 5vw, 26px); height: clamp(18px, 5vw, 26px); display: block; }
      .brand.lg { flex-direction: column; gap: 12px; font-size: 18px; }
      .brand.lg img { width: 56px; height: 56px; }
      /* The network switcher. Neutral on mainnet; the amber .net-badge
         treatment is added on every other chain (see Dashboard header). */
      .net-switch {
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        max-width: 92px;
      }
      /* Amber = not mainnet, wherever it appears (header switcher, wallet list). */
      .net-badge {
        font-family: var(--display); font-size: 7px; letter-spacing: 0.5px;
        padding: 2px 5px; border: 1px solid #E8A33D; color: #E8A33D;
        border-radius: 3px; line-height: 1;
      }
      .btn-icon.net-badge { font-size: 9px; padding: 3px 7px; }
      /* Mainnet counterpart of .net-badge: states the chain without shouting. */
      .net-label {
        font-family: var(--display); font-size: 7px; letter-spacing: 0.5px;
        padding: 2px 5px; border: 1px solid var(--border); color: var(--text-dim);
        border-radius: 3px; line-height: 1;
      }

      h2 {
        font-family: var(--display); font-size: 15px; font-weight: 400;
        text-transform: uppercase; letter-spacing: 1px; margin: 0 0 14px;
      }
      h4 {
        font-family: var(--display); font-size: 10px; font-weight: 400;
        color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px;
        margin: 18px 0 8px;
      }
      .tagline { color: var(--text-dim); font-size: 12px; }

      .card {
        background: transparent;
        border: none;
        border-radius: 0;
        padding: 16px;
        margin-bottom: 12px;
      }
      .balance-card { text-align: center; }
      .balance {
        font-family: var(--display); font-size: 22px; letter-spacing: 1px;
        margin: 10px 0 4px;
      }
      .balance .unit { font-size: 12px; color: var(--green); }
      /* receive view fits the viewport; scrolls internally if it can't */
      .receive-card {
        flex: 1 1 0px; min-height: 100px;
        overflow-y: auto; margin-bottom: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      }
      .receive-card > * { flex: none; width: 100%; }
      .receive-card .qr-box { width: auto; }
      .qr-box {
        display: inline-block; background: #ffffff; padding: 10px;
        border: 1px solid var(--border); line-height: 0;
      }
      .eye-btn {
        background: transparent; border: none; color: var(--text-dim);
        padding: 2px 4px; margin-left: 6px; vertical-align: middle; line-height: 0;
      }
      .eye-btn:hover { color: var(--green); }
      /* shimmer skeletons while data loads */
      .skel {
        display: inline-block; border-radius: 3px;
        background: linear-gradient(90deg, #161616 25%, #242424 50%, #161616 75%);
        background-size: 200% 100%;
        animation: shimmer 1.3s ease-in-out infinite;
      }
      @keyframes shimmer { to { background-position: -200% 0; } }
      .skel-row { display: flex; align-items: center; gap: 10px; padding: 9px 4px; }
      .skel-circle { width: 26px; height: 26px; border-radius: 50%; flex: none; }

      .fiat { font-size: 10.5px; color: var(--text-dim); margin: -2px 0 8px; }
      .fiat b { color: var(--text); }
      .sub-balances {
        display: flex; justify-content: center; gap: 18px;
        font-size: 10.5px; color: var(--text-dim); margin-bottom: 10px;
      }
      .sub-balances b { font-weight: 700; }
      .sync { font-size: 10px; color: var(--text-dim); }
      .sync .live { color: var(--green); }

      .addr {
        display: flex; align-items: center; gap: 6px;
        font-family: var(--mono); font-size: 12px; color: var(--text-dim);
        background: #0d0d0d; border: 1px solid var(--border);
        padding: 7px 9px; margin-top: 12px;
      }
      .addr span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: left; }
      .addr .btn-icon, .addr .btn-icon:hover { border-color: transparent; }

      button {
        font-family: var(--mono); font-size: 13px; font-weight: 700;
        border: none; border-radius: 0; padding: 12px 18px; cursor: pointer;
        transition: background 0.12s ease, color 0.12s ease, transform 0.08s ease;
      }
      button:active { transform: scale(0.98); }
      button:disabled { opacity: 0.4; cursor: default; }
      .btn-primary {
        width: 100%;
        background: #ffffff;
        color: #000000;
      }
      .btn-primary:hover { background: var(--green); color: #000; }
      .btn-ghost {
        background: transparent; color: var(--text);
        border: 1px solid var(--border);
      }
      .btn-ghost:hover { border-color: var(--text-dim); }
      .btn-icon {
        background: transparent; color: var(--green);
        border: 1px solid var(--border);
        padding: 4px 9px; font-size: 12px; font-weight: 400;
      }
      .btn-icon:hover { border-color: var(--green); }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }

      input, textarea, select {
        width: 100%; color: var(--text);
        background: #0d0d0d;
        border: 1px solid var(--border);
        border-radius: 0; padding: 11px 12px; margin-bottom: 10px;
        font-family: var(--mono); font-size: 12.5px; outline: none;
        transition: border-color 0.15s;
      }
      input::placeholder, textarea::placeholder { color: #555; }
      input:focus, textarea:focus, select:focus { border-color: var(--green); }
      textarea { font-size: 11px; resize: vertical; }
      select { cursor: pointer; }
      select:disabled { opacity: 0.6; cursor: not-allowed; color: var(--text-dim); }

      .seed {
        font-family: var(--mono); font-size: 11.5px; line-height: 1.8;
        background: #0d0d0d; border: 1px dashed var(--green);
        padding: 12px; color: var(--green);
        word-spacing: 4px; margin-bottom: 10px;
        overflow-wrap: anywhere;
      }
      .warn { color: #f5a623; font-size: 11px; }
      .error { color: var(--red); font-size: 11px; word-break: break-word; }
      /* Status strip at the very bottom of the panel (e.g. "rpc node
         unreachable"). margin-top:auto pins it to the foot of the flex column
         even when the content above is short, so it reads as chrome rather
         than as a message wedged into the page. */
      .status-footer {
        margin-top: auto; flex: none;
        border-top: 1px solid var(--border);
        padding-top: 8px; margin-bottom: 0;
        text-align: center;
      }
      .status-footer .error { font-size: 10.5px; line-height: 1.45; }
      .ok { color: var(--green); font-size: 11px; word-break: break-all; }
      .muted { color: var(--text-dim); font-size: 11.5px; }

      .tx {
        display: flex; align-items: center; justify-content: space-between;
        padding: 9px 0; border-bottom: 1px solid #191919;
      }
      .tx:last-child { border-bottom: none; }
      .tx .icon {
        width: 26px; height: 26px; margin-right: 10px; flex: none;
        display: flex; align-items: center; justify-content: center; font-size: 13px;
        border: 1px solid var(--green); color: var(--green);
      }
      .tx .icon.out { border-color: var(--red); color: var(--red); }
      .tx .meta { flex: 1; min-width: 0; }
      .tx .hash { font-size: 9px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tx .when { font-size: 10px; color: var(--text-dim); }
      .tx .amt { font-weight: 700; font-size: 12px; text-align: right; flex: none; }
      .tx .amt.in { color: var(--green); }
      .tx .amt.out { color: var(--red); }
      .tx .pending { font-size: 9px; color: #f5a623; }

      .menu-item {
        display: flex; align-items: center; justify-content: space-between;
        padding: 12px 16px; cursor: pointer; font-size: 12.5px;
        border-bottom: 1px solid #191919;
        transition: background 0.1s;
      }
      .menu-item:hover { background: rgba(62, 199, 69, 0.06); }
      .menu-item .chev { color: var(--text-dim); }
      .menu-item.danger { color: var(--red); }
      .menu-item.danger:hover { background: rgba(255, 92, 92, 0.06); }
      .menu-item.disabled { cursor: default; opacity: 0.6; }
      .menu-item.disabled:hover { background: transparent; }

      .settings-header { display: flex; align-items: center; gap: 12px; padding: 4px 16px 12px; }
      .settings-header h2 { margin: 0; }
      .settings-back {
        width: 32px; height: 32px; flex: none; padding: 0;
        border-radius: 10px; border: 1px solid var(--border);
        background: transparent; color: var(--text);
        display: flex; align-items: center; justify-content: center;
      }
      .settings-back:hover { border-color: var(--text-dim); }

      .settings-divider { border-top: 1px solid var(--border); margin: 6px 0; }
      /* prominent section title above a card (Token Details / Activity) — bolder
         and brighter than settings-section-label, which is a dim in-list divider */
      .detail-section-label {
        font-family: var(--display); font-size: 11px; font-weight: 400;
        color: var(--text); text-transform: uppercase; letter-spacing: 1.5px;
        margin: 18px 0 8px;
      }
      .settings-section-label {
        font-family: var(--display); font-size: 9px; font-weight: 400;
        color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px;
        padding: 8px 16px 4px;
      }
      .settings-item {
        display: flex; align-items: center; gap: 12px;
        padding: 11px 16px; cursor: pointer; font-size: 12.5px;
        transition: background 0.1s;
      }
      .settings-item:hover { background: rgba(62, 199, 69, 0.06); }
      .settings-item .icon { color: var(--text-dim); flex: none; display: flex; }
      .settings-item .label { flex: 1; min-width: 0; }
      .settings-item .chev { color: var(--text-dim); flex: none; }
      .settings-item.danger { color: var(--red); }
      .settings-item.danger .icon { color: var(--red); }
      .settings-item.danger:hover { background: rgba(255, 92, 92, 0.06); }

      .switch {
        width: 30px; height: 16px; flex: none;
        background: #1c1c1c; border: 1px solid var(--border);
        display: inline-flex; align-items: center; padding: 1px;
        transition: background 0.15s, border-color 0.15s;
      }
      .switch .knob {
        width: 12px; height: 12px; background: var(--text-dim);
        transition: transform 0.15s, background 0.15s;
      }
      .switch.on { border-color: var(--green); }
      .switch.on .knob { transform: translateX(14px); background: var(--green); }

      .btn-danger {
        background: transparent; color: var(--red);
        border: 1px solid var(--red); width: 100%;
      }
      .btn-danger:hover { background: var(--red); color: #000; }

      .modal-overlay {
        position: fixed; inset: 0; z-index: 10;
        background: rgba(0, 0, 0, 0.75);
        display: flex; align-items: center; justify-content: center;
        padding: 24px;
      }
      .modal {
        background: var(--panel); border: 1px solid var(--border);
        padding: 20px; width: 100%; max-width: 340px;
        /* A list of wallets can outgrow the viewport. Without a ceiling the
           modal overflowed the overlay and rows rendered over one another, so
           it scrolls internally instead. */
        max-height: calc(100vh - 48px);
        overflow-y: auto;
        display: flex; flex-direction: column;
      }
      /* The rows scroll; the action row beneath them stays put. */
      .modal-list { overflow-y: auto; flex: 1 1 auto; min-height: 0; margin: 0 -4px; padding: 0 4px; }

      .home-tabs {
        display: flex; gap: 18px;
        border-bottom: 1px solid var(--border);
        margin: 14px 0 10px;
      }
      .home-tab {
        background: transparent; border: none; border-bottom: 2px solid transparent;
        margin-bottom: -1px; padding: 0 0 8px;
        color: var(--text-dim); font-family: var(--mono); font-size: 12px; font-weight: 700;
        cursor: pointer;
      }
      .home-tab.active { color: var(--text); border-bottom-color: var(--green); }

      .chips { display: flex; gap: 4px; }
      .chip {
        background: transparent; color: var(--text-dim);
        border: 1px solid var(--border);
        padding: 3px 8px; font-size: 10px; font-weight: 400;
      }
      .chip.active { color: var(--green); border-color: var(--green); }

      .tx .tx-info {
        background: transparent; color: var(--text-dim); border: none;
        padding: 2px 0 2px 8px; font-size: 13px; font-weight: 400; flex: none;
      }
      .tx .tx-info:hover { color: var(--green); }

      .detail-row {
        display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
        padding: 7px 0; border-bottom: 1px solid #191919; font-size: 11.5px;
      }
      .detail-row:last-of-type { border-bottom: none; }
      .detail-row .pending { color: #f5a623; }

      /* ---- send progress / result animations ---- */
      .spinner {
        width: 44px; height: 44px; margin: 6px auto 0;
        border: 3px solid #1c1c1c; border-top-color: var(--green);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      .send-step { animation: step-in 0.25s ease; min-height: 16px; }
      @keyframes step-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

      .progress {
        height: 3px; background: #1c1c1c; margin: 10px 0 6px; overflow: hidden;
      }
      .progress .bar {
        height: 100%; background: var(--green);
        transition: width 0.4s ease;
        box-shadow: 0 0 8px var(--green);
      }

      .tick { display: block; margin: 4px auto 0; }
      .tick-circle {
        stroke: var(--green); stroke-width: 2;
        stroke-dasharray: 151; stroke-dashoffset: 151;
        animation: tick-draw 0.5s ease forwards;
      }
      .tick-check {
        stroke: var(--green); stroke-width: 3;
        stroke-linecap: square;
        stroke-dasharray: 36; stroke-dashoffset: 36;
        animation: tick-draw 0.3s 0.45s ease forwards;
      }
      @keyframes tick-draw { to { stroke-dashoffset: 0; } }

      .fail-mark {
        width: 48px; height: 48px; margin: 6px auto 0;
        border: 2px solid var(--red); color: var(--red);
        display: flex; align-items: center; justify-content: center;
        font-size: 22px;
        animation: pop 0.25s ease;
      }
      @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

      /* seed confirmation quiz */
      .quiz-slots { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
      .quiz-slot {
        display: flex; justify-content: space-between; align-items: baseline;
        font-family: var(--mono); font-size: 12px;
        background: #0d0d0d; border: 1px solid var(--border); padding: 8px 10px;
      }
      .quiz-slot.next { border-color: var(--green); }
      .quiz-slot b { color: var(--green); }
      .quiz-words { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
      .word-chip {
        font-family: var(--mono); font-size: 12px; font-weight: 400;
        background: transparent; color: var(--text);
        border: 1px solid var(--border); padding: 8px 12px;
      }
      .word-chip:hover { border-color: var(--green); }
      .word-chip.picked { opacity: 0.35; border-style: dashed; }

      .checkbox { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; color: var(--text-dim); font-size: 12px; }
      .checkbox input { width: auto; margin: 0; accent-color: var(--green); }
      .center { text-align: center; }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-thumb { background: #2a2a2a; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="panel.js"></script>
  </body>
</html>
