<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Michroma";
        src: url("fonts/michroma-400.woff2") format("woff2");
        font-weight: 400; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: "Space Mono";
        src: url("fonts/space-mono-400.woff2") format("woff2");
        font-weight: 400; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: "Space Mono";
        src: url("fonts/space-mono-700.woff2") format("woff2");
        font-weight: 700; font-style: normal; font-display: swap;
      }
      :root {
        --bg: #0a0a0a; --panel: #101010; --border: #222222;
        --green: #3ec745; --blue: #1574ad;
        --text: #f2f2f2; --text-dim: #8a8a8a; --red: #ff5c5c;
        --display: "Michroma", system-ui, sans-serif;
        --mono: "Space Mono", "SF Mono", Consolas, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; color: var(--text);
        font-family: var(--mono); font-size: 12.5px;
        background-color: var(--bg);
        background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1.5px);
        background-size: 26px 26px;
      }
      .wrap { padding: 18px; max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; min-height: 100vh; }
      .brand {
        display: flex; align-items: center; gap: 10px; justify-content: center;
        font-family: var(--display); font-size: 14px; letter-spacing: 1px;
        text-transform: uppercase; margin-bottom: 16px; padding-bottom: 14px;
        border-bottom: 1px solid var(--border);
      }
      .brand img { width: 26px; height: 26px; display: block; }
      /* Amber = not mainnet. Matches the panel, so the same signal means the
         same thing in both approval surfaces. */
      .net-badge {
        font-family: var(--display); font-size: 7px; letter-spacing: 0.5px;
        padding: 2px 5px; border: 1px solid #E8A33D; color: #E8A33D;
        border-radius: 3px; line-height: 1;
      }
      h2 {
        font-family: var(--display); font-size: 15px; font-weight: 400;
        text-transform: uppercase; letter-spacing: 1px; margin: 0 0 14px; text-align: center;
      }
      .card { background: var(--panel); border: 1px solid var(--border); padding: 16px; margin-bottom: 12px; }
      h4 {
        font-family: var(--display); font-size: 10px; font-weight: 400;
        color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px;
        margin: 14px 0 6px;
      }
      .origin {
        font-size: 14px; font-weight: 700; color: var(--green);
        word-break: break-all; text-align: center;
        border: 1px dashed var(--green); padding: 12px; margin-bottom: 14px;
        background: #0d0d0d;
      }
      .kv { font-size: 11px; color: var(--text-dim); margin: 8px 0 2px; text-transform: uppercase; letter-spacing: 1px; }
      .val { font-size: 11px; word-break: break-all; background: #0d0d0d; border: 1px solid var(--border); padding: 8px 10px; }
      button {
        font-family: var(--mono); font-size: 13px; font-weight: 700;
        border: none; border-radius: 0; padding: 12px 18px; cursor: pointer;
        transition: background 0.12s ease, color 0.12s ease, transform 0.08s ease;
      }
      button:active { transform: scale(0.98); }
      button:disabled { opacity: 0.4; cursor: default; }
      .btn-primary { width: 100%; background: #ffffff; color: #000000; }
      .btn-primary:hover { background: var(--green); color: #000; }
      .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
      .btn-ghost:hover { border-color: var(--text-dim); }
      .row { display: flex; gap: 8px; margin-top: 6px; }
      .row > * { flex: 1; }
      input {
        width: 100%; color: var(--text); background: #0d0d0d;
        border: 1px solid var(--border); border-radius: 0; padding: 11px 12px;
        margin-bottom: 10px; font-family: var(--mono); font-size: 12.5px; outline: none;
      }
      input:focus { border-color: var(--green); }
      input::placeholder { color: #555; }
      .muted { color: var(--text-dim); font-size: 11.5px; }
      .error { color: var(--red); font-size: 11px; word-break: break-word; }
      .warn { color: #f5a623; font-size: 11px; }
      .center { text-align: center; }
      .spacer { flex: 1; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="approval.js"></script>
  </body>
</html>
